name: Download Google Files
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download AAR and POM files
        run: |
          curl -L -o lifecycle-runtime-ktx-2.6.2.aar https://dl.google.com/dl/android/maven2/androidx/core/lifecycle-runtime-ktx/2.6.2/lifecycle-runtime-ktx-2.6.2.aar
          curl -L -o lifecycle-runtime-ktx-2.6.2.pom https://dl.google.com/dl/android/maven2/androidx/core/lifecycle-runtime-ktx/2.6.2/lifecycle-runtime-ktx-2.6.2.pom

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add lifecycle-runtime-ktx-2.6.2.aar lifecycle-runtime-ktx-2.6.2.pom
          git commit -m "Added both offline files" || echo "No changes to commit"
          git push
